name: Sophena connector image

on:
  workflow_dispatch:
  push:
    tags:
      - sophena-v2.0.5-1

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  CONNECTOR_VERSION: 2.0.5-sophena.1
  CDC_JAVA_REPOSITORY: Lightning-Codes/scylla-cdc-java
  CDC_JAVA_REVISION: cb1d759a946f8c6255779c2bb4ddac87fad0bff9
  CDC_JAVA_VERSION: 1.3.12-sophena.1
  IMAGE_NAME: ghcr.io/lightning-codes/scylla-cdc-source-connector
  MAVEN_VERSION: 3.9.11
  MAVEN_SHA512: bcfe4fe305c962ace56ac7b5fc7a08b87d5abd8b7e89027ab251069faebee516b0ded8961445d6d91ec1985dfe30f8153268843c89aa392733d1a3ec956c9978

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out connector source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          path: connector
          persist-credentials: false

      - name: Check out locked CDC Java source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: ${{ env.CDC_JAVA_REPOSITORY }}
          ref: ${{ env.CDC_JAVA_REVISION }}
          path: cdc-java
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: |
            connector/pom.xml
            cdc-java/pom.xml
            cdc-java/*/pom.xml

      - name: Install checksum-locked Maven
        shell: bash
        run: |
          set -euo pipefail
          archive="apache-maven-${MAVEN_VERSION}-bin.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$archive" \
            "https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/${MAVEN_VERSION}/$archive"
          printf '%s  %s\n' "$MAVEN_SHA512" "$RUNNER_TEMP/$archive" | sha512sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          printf '%s\n' "$RUNNER_TEMP/apache-maven-${MAVEN_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Verify locked revisions and toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'Lightning-Codes/scylla-cdc-source-connector'
          test "$(git -C connector rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C cdc-java rev-parse HEAD)" = "$CDC_JAVA_REVISION"
          test "$(mvn -q -f cdc-java/pom.xml help:evaluate -Dexpression=project.version -DforceStdout)" = "$CDC_JAVA_VERSION"
          test "$(mvn -q -f connector/pom.xml help:evaluate -Dexpression=project.version -DforceStdout)" = "$CONNECTOR_VERSION"
          mvn --version | head -n 1 | grep -F "Apache Maven $MAVEN_VERSION"

      - name: Test and install CDC Java fork
        run: |
          mvn -B -ntp -f cdc-java/pom.xml \
            -pl scylla-cdc-driver3 -am test \
            -Ddocker.skip=true -DskipITs
          mvn -B -ntp -f cdc-java/pom.xml \
            -pl scylla-cdc-driver3 -am install \
            -DskipTests -Ddocker.skip=true -DskipITs

      - name: Test and package connector
        run: |
          mvn -B -ntp -f connector/pom.xml fmt:check
          mvn -B -ntp -f connector/pom.xml test -DskipITs
          mvn -B -ntp -f connector/pom.xml package -DskipTests -DskipITs

      - name: Prepare immutable plugin directory
        shell: bash
        run: |
          set -euo pipefail
          package_name="Lightning-Codes-scylla-cdc-source-connector-${CONNECTOR_VERSION}"
          package_dir="connector/target/components/packages/${package_name}/${package_name}"
          test -d "$package_dir/lib"
          test -f "$package_dir/lib/scylla-cdc-driver3-${CDC_JAVA_VERSION}.jar"
          test -f "$package_dir/lib/netty-handler-4.1.136.Final.jar"
          jar tf "$package_dir/lib/scylla-cdc-driver3-${CDC_JAVA_VERSION}.jar" \
            | grep -Fx 'com/scylladb/cdc/cql/driver3/StrictRemoteEndpointAwareNettySSLOptions.class'
          jar tf "$package_dir/lib/scylla-cdc-source-connector-${CONNECTOR_VERSION}.jar" \
            | grep -Fx 'com/scylladb/cdc/debezium/connector/StrictRemoteEndpointAwareNettySSLOptions.class'
          mkdir connector/dist
          cp -a "$package_dir"/. connector/dist/

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.CONNECTOR_VERSION }}
            type=sha,format=long
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            io.sophena.cdc-java.revision=${{ env.CDC_JAVA_REVISION }}

      - name: Build and publish multi-architecture image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: connector
          file: connector/Dockerfile.sophena
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
